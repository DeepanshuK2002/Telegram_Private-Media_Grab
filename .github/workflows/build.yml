name: Build Executables

on:
  workflow_dispatch:

env:
  VERSION: 'latest'

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Extract App Version
        id: get_version
        shell: bash
        run: |
          python -c "import re; m = re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('src/gui.py', encoding='utf-8').read()); print(f\"VERSION={m.group(1)}\")" >> $GITHUB_ENV

      - name: Build executable
        shell: bash
        run: |
          cd src
          python -m PyInstaller --noconfirm --onefile --windowed \
            --add-data "assets;assets" \
            --icon "assets/logo.ico" \
            --hidden-import "core_downloader" \
            --hidden-import "telethon" \
            --hidden-import "PySide6.QtCore" \
            --hidden-import "PySide6.QtGui" \
            --hidden-import "PySide6.QtWidgets" \
            --name "TGPrivateGrab-v${VERSION}" \
            gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGPrivateGrab-v${{ env.VERSION }}-Windows-x64
          path: |
            src/dist/TGPrivateGrab-v${{ env.VERSION }}.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/dist/TGPrivateGrab-v${{ env.VERSION }}.exe
          name: TG Private Grab v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}